[package]
name = "mono-greeter"
version = "0.1.3"
edition = "2024"
description = "A keyboard-first greeter for greetd, in a terminal (cage + foot + ratatui)"
license = "MIT"
repository = "https://github.com/rafiibrahim8/mono-greeter"
readme = "README.md"

[dependencies]
chrono = "0.4"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = "thin"
strip = true
