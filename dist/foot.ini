# foot config for the greeter. cage runs foot fullscreen; mono-greeter sets the colours itself.
# spacing=mono: without Hack installed, fontconfig falls back to the default monospace font
# instead of a proportional one.
[main]
font=Hack Nerd Font Mono:size=14:spacing=mono,monospace:size=14
pad=0x0

[mouse]
hide-when-typing=yes
